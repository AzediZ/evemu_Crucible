services:
  server:
    image: "evemu_server_revised" # its own name, so an image built from the old code base is never started on this universe
    build: #Build image from source repository
      context: .
      args:
        - WITH_GDB=${RUN_GDB:-FALSE} # gdb is only in the image when it's built with RUN_GDB=TRUE (see Dockerfile)
    container_name: server
    volumes:
      - ./config:/app/etc
      # the caches belong to the universe in db_revised:  server_cache keeps static data read from that database
      - server_cache_revised:/app/server_cache
      - image_cache_revised:/app/image_cache
    ports:
      - "26000:26000"
      - "26001:26001"
    depends_on:
      - db
    links:
      - "db"
    environment:
      - RUN_WITH_GDB=${RUN_GDB:-FALSE} #Set to TRUE to run evemu with gdb automatically
    stdin_open: true # Enables stdin for the container. Attach to it with 'docker attach'
    tty: true
    # docker stop (and compose stop, restart and down) sends SIGTERM, which start.sh passes on to eve-server:  it logs
    #  everyone out and saves before it exits.  Docker kills it after stop_grace_period (default 10 s), so allow
    #  time for the save;  the stop ends as soon as the server has exited
    stop_grace_period: 2m
    init: true # a small init process as PID 1 that passes signals on and reaps orphaned processes
    # Docker keeps everything the server prints (docker logs server) in a file that otherwise grows for as long as
    #  the container exists.  Keep the last 100 MB, in 5 files of 20 MB
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # cap_add: #This is required for gdb to work
    #   - SYS_PTRACE

  db:
    image: "mariadb:11.8"
    container_name: db
    volumes:
      # the universe.  db_revised is a fresh database for this code base;  the old universe stays in the db volume
      - db_revised:/var/lib/mysql
    # If you want to connect to the Database pick your host port to map it to, (host-port:container-port) below. 
    #ports:
    #  - "3306:3306"  
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_USER=evemu
      - MARIADB_PASSWORD=evemu
      - MARIADB_DATABASE=evemu

volumes:
  db_revised:
  server_cache_revised:
  image_cache_revised:

